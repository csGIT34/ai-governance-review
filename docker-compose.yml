# Local development: app + Postgres + Azurite (blob). Data persists in named volumes.
services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://governance:governance@db:5432/governance
      BLOB_CONNECTION_STRING: >-
        DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;
      # Dev login switcher (alice=admin, bob=reviewer, carol=preparer, victor=viewer).
      # NEVER use dev mode outside your machine.
      AUTH_MODE: dev
      EVIDENCE_REPO_BASE: ${EVIDENCE_REPO_BASE:-}
      # --- Optional: Azure scope sync + AI catalog enrichment (see README) ---
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_ROOT_MANAGEMENT_GROUP: ${AZURE_ROOT_MANAGEMENT_GROUP:-}
      AZURE_SUBSCRIPTION_ID: ${AZURE_SUBSCRIPTION_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      # GOOGLE_APPLICATION_CREDENTIALS: /gcp/adc.json
    # volumes:
    #   - ${APPDATA}/gcloud/application_default_credentials.json:/gcp/adc.json:ro
    depends_on:
      db:
        condition: service_healthy
      azurite:
        condition: service_started

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: governance
      POSTGRES_PASSWORD: governance
      POSTGRES_DB: governance
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "governance"]
      interval: 2s
      retries: 30

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite-blob --blobHost 0.0.0.0
    ports:
      - "10000:10000"
    volumes:
      - azurite-data:/data

volumes:
  pg-data:
  azurite-data:
