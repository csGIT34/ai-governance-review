services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      COSMOS_ENDPOINT: http://cosmos:8081
      BLOB_CONNECTION_STRING: >-
        DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;
      # --- Optional: CSP catalog enrichment (see README) ---
      AZURE_SUBSCRIPTION_ID: ${AZURE_SUBSCRIPTION_ID:-}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      # GOOGLE_APPLICATION_CREDENTIALS: /gcp/adc.json
    # volumes:
    #   - ${APPDATA}/gcloud/application_default_credentials.json:/gcp/adc.json:ro
    depends_on:
      - cosmos
      - azurite

  cosmos:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview
    ports:
      - "8081:8081"   # data plane (http)
      - "1234:1234"   # data explorer UI
    environment:
      PROTOCOL: http

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite-blob --blobHost 0.0.0.0
    ports:
      - "10000:10000"
    volumes:
      - azurite-data:/data

volumes:
  azurite-data:
